<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
<g clip-path="url(#gate_dark_clip)">
<rect width="1920" height="1080" fill="#0a0a0a"/>
<g filter="url(#gate_dark_blur)">
<!-- Dim blue wash — sits low enough that dark mode stays near-black -->
<ellipse cx="960" cy="-80" rx="1000" ry="380" fill="#082438"/>
<ellipse cx="980" cy="-140" rx="780" ry="300" fill="#0A3550"/>
<ellipse cx="940" cy="-200" rx="560" ry="220" fill="#0D4568"/>
</g>
</g>
<defs>
<filter id="gate_dark_blur" x="-400" y="-800" width="2720" height="1600" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
<feFlood flood-opacity="0" result="BackgroundImageFix"/>
<feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
<feGaussianBlur stdDeviation="160" result="effect1_foregroundBlur"/>
</filter>
<clipPath id="gate_dark_clip">
<rect width="1920" height="1080" fill="white"/>
</clipPath>
</defs>
</svg>
